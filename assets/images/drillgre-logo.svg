<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">DrillGRE</title><desc id="desc">DrillGRE wordmark with a rising bar chart inside a stylized D and a graduation cap above the letter i.</desc>
<defs><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09224d"/><stop offset="1" stop-color="#102b59"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0878f9"/><stop offset="1" stop-color="#1457ec"/></linearGradient></defs>
<!-- D emblem with rising performance bars -->
<path d="M18 22H91C174 22 215 63 215 133S174 202 91 202H18L42 160H91C137 160 162 151 162 112S137 64 91 64H60L39 181H0L18 22Z" fill="url(#navy)"/>
