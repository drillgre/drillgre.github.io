<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">DrillGRE</title><desc id="desc">A single D containing a spiral drill bit, followed by the DrillGRE wordmark.</desc>
<defs><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08224e"/><stop offset="1" stop-color="#102b59"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0878f9"/><stop offset="1" stop-color="#1457ec"/></linearGradient></defs>
<!-- One integrated D glyph -->
<path d="M18 22H106C190 22 231 63 231 132S190 202 106 202H12L42 162H106C151 162 177 151 177 112S151 62 106 62H51L36 181H0L18 22Z" fill="url(#navy)"/>
<!-- drill chuck -->
<path d="M70 62H142V79C142 88 136 94 126 99L126 111L89 137L89 100C78 96 70 89 70 79Z" fill="#0b2857"/>
<!-- spiral flutes and drill point -->
<path d="M89 132L126 108V130L89 155Z" fill="url(#blue)"/>
<path d="M89 155L126 131V153L89 179Z" fill="url(#blue)"/>
<path d="M89 179L126 155L108 196Z" fill="url(#blue)"/>
<!-- subtle drilling impact marks -->
<path d="M79 184L61 197M137 184L155 197M108 199V211" fill="none" stroke="#0b2857" stroke-width="4" stroke-linecap="round"/>
<!-- Wordmark: the D is not repeated -->
<text x="248" y="169" font-family="Arial, Helvetica, sans-serif" font-size="146" font-weight="800" letter-spacing="-8" fill="#0b234d">r</text>
<rect x="310" y="65" width="31" height="104" rx="2" fill="#0b234d"/>
<text x="350" y="169" font-family="Arial, Helvetica, sans-serif" font-size="146" font-weight="800" letter-spacing="-8" fill="#0b234d">ll</text>
<circle cx="325" cy="35" r="15" fill="#145cf0"/>
<text x="480" y="169" font-family="Arial, Helvetica, sans-serif" font-size="146" font-weight="800" letter-spacing="-7" fill="#145cf0">GRE</text>
</svg>