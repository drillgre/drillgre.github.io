<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Quarterly Government Revenue</title>
<desc id="desc">Bar chart showing Q1 revenue of 70 million NPR, Q2 revenue of 85 million NPR, and Q3 revenue of 100 million NPR.</desc>
<rect width="760" height="440" fill="#ffffff"/>
<text x="380" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172554">Quarterly Government Revenue</text>
<text x="380" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#475569">Millions of NPR</text>
<g stroke="#dbe3ef" stroke-width="1"><line x1="100" y1="340" x2="690" y2="340"/><line x1="100" y1="280" x2="690" y2="280"/><line x1="100" y1="220" x2="690" y2="220"/><line x1="100" y1="160" x2="690" y2="160"/><line x1="100" y1="100" x2="690" y2="100"/></g>
<g fill="#475569" font-family="Arial,sans-serif" font-size="13" text-anchor="end"><text x="88" y="345">0</text><text x="88" y="285">20</text><text x="88" y="225">40</text><text x="88" y="165">60</text><text x="88" y="105">80</text><text x="88" y="75">100</text></g>
<line x1="100" y1="70" x2="100" y2="340" stroke="#64748b" stroke-width="2"/><line x1="100" y1="340" x2="690" y2="340" stroke="#64748b" stroke-width="2"/>
<g fill="#4f83cc"><rect x="190" y="130" width="100" height="210" rx="5"/><rect x="370" y="85" width="100" height="255" rx="5"/><rect x="550" y="40" width="100" height="300" rx="5"/></g>
<g fill="#172554" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle"><text x="240" y="118">70</text><text x="420" y="73">85</text><text x="600" y="28">100</text></g>
<g fill="#334155" font-family="Arial,sans-serif" font-size="17" text-anchor="middle"><text x="240" y="370">Q1</text><text x="420" y="370">Q2</text><text x="600" y="370">Q3</text></g>
<text x="380" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#64748b">Quarter</text>
</svg>